<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>もち出口3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120d0a;color:#fff6e6;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;height:100dvh}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.screen.active{display:flex}
#title{background:radial-gradient(ellipse at 50% 42%,#1a120c99,#120d0ae6 75%)}
.logo{font-size:min(14vw,64px);font-weight:900;letter-spacing:.06em;color:#ffe9c4;text-shadow:0 0 18px #ff8a3c,0 3px 0 #7a3b17}
.logo small{display:block;font-size:.34em;letter-spacing:.3em;color:#ffb36b;margin-top:6px}
.btn{font:inherit;font-weight:800;font-size:20px;color:#2b1608;background:linear-gradient(#ffd9a0,#ffae52);border:0;border-radius:999px;padding:14px 44px;min-width:200px;box-shadow:0 5px 0 #a35a17,0 8px 18px #0008}
.btn.sub{background:#3a2a20;color:#ffe3bd;box-shadow:0 4px 0 #1c120c;font-size:16px;padding:10px 30px;min-width:160px}
.btn:active{transform:translateY(3px)}
#hud{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));font-weight:900;font-size:22px;text-shadow:0 2px 6px #000;pointer-events:none;display:none}
#play.active #hud{display:block}
/* #play は全面を覆うので、そのままだと指の操作が下の 3D 画面に届かない。ボタンだけ受け付ける */
#play{pointer-events:none}
#play button{pointer-events:auto}
#guide{position:absolute;left:0;right:0;bottom:max(70px,calc(env(safe-area-inset-bottom) + 56px));display:none;justify-content:space-between;padding:0 10px;pointer-events:none;transition:opacity .6s}
#guide.on{display:flex}
#guide.off{opacity:0}
#guide div{width:46%;padding:14px 6px;border:2px dashed #fff8;border-radius:16px;background:#0005;font-size:15px;font-weight:800;line-height:1.5;text-align:center;text-shadow:0 1px 4px #000}
#guide small{display:block;font-weight:600;font-size:12px;opacity:.85}
#muteBtn{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:20px;display:none}
#play.active #muteBtn{display:block}
#toast{white-space:nowrap;position:absolute;left:50%;top:36%;transform:translateX(-50%);width:max-content;max-width:94vw;text-align:center;font-size:clamp(18px,5.6vw,32px);font-weight:900;text-shadow:0 2px 6px #000;background:#000b;border-radius:999px;padding:8px 22px;visibility:hidden;pointer-events:none}
#toast.show{visibility:visible}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
#stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #fff5;background:#fff1;display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff8}
#hint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;color:#ffe3bd;opacity:.75;text-shadow:0 1px 4px #000;pointer-events:none;display:none}
#play.active #hint{display:block}
#result{background:radial-gradient(ellipse at 50% 42%,#1a120c99,#120d0ae6 75%)}
#result h2{margin:0;font-size:38px;color:#ffe9c4;text-shadow:0 0 16px #ff8a3c}
#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.open{display:flex}
#modal .card{background:#2a1c14;border-radius:18px;padding:22px;max-width:420px;line-height:1.8;font-size:15px;text-align:left}
#modal .card .btn{margin:6px 6px 0 0}
#resultInfo{background:#0008;border-radius:16px;padding:14px 22px;min-width:260px;line-height:1.9;font-size:17px}
#resultInfo .new{display:inline-block;margin-left:8px;padding:0 10px;border-radius:999px;background:#ffb000;color:#2b1608;font-weight:900;font-size:14px}
#resultInfo small{opacity:.8}
#zukan{position:absolute;inset:0;background:#0d0907f2;display:none;z-index:6;overflow:auto;padding:max(14px,env(safe-area-inset-top)) 12px 20px}
#zukan.open{display:block}
.zwrap{max-width:860px;margin:0 auto}
.zhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:12px;font-size:20px}
.zhead b,.zhead span{white-space:nowrap}
.zhead span{opacity:.85;font-size:15px}
.zhead .btn{margin-left:auto}
#zGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.zc{background:#2a1c14;border-radius:14px;overflow:hidden;font-size:14px}
.zc img,.zc .zq{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#120d0a}
.zc .zq{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#5a4636}
.zc p{margin:0;padding:8px 10px 10px;line-height:1.5}
.zc .lv{color:#ffb36b;letter-spacing:2px;font-size:12px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="title" class="screen active">
    <div class="logo">もち出口<small>3D  MOCHI EXIT</small></div>
    <button class="btn" id="startBtn">はじめる</button>
    <button class="btn sub" id="howBtn">あそびかた</button>
  </div>
  <div id="play" class="screen">
    <div id="hud">出口 <span id="exitNo">0</span></div>
    <button id="muteBtn" aria-label="音">🔊</button>
    <div id="toast"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="guide"><div>👈 左をなぞる<small>上へなぞると前へ歩く</small></div><div>右をなぞる 👉<small>左右へなぞると見回す</small></div></div>
    <div id="hint"></div>
  </div>
  <div id="result" class="screen">
    <h2>脱出成功！</h2>
    <div id="resultInfo"></div>
    <button class="btn" id="againBtn">もういちど</button>
    <button class="btn sub" id="zukanBtn">見つけた異変</button>
  </div>
  <div id="fade"></div>
  <div id="modal"><div class="card">
    <b>あそびかた</b><br>
    ・同じ通路を歩いて、<b>「いつもの通路」と違う所（異変）</b>を探します。<br>
    ・異変を見つけたら<b>引き返す</b>。何もなければ<b>そのまま奥へ進む</b>。<br>
    ・正解すると出口の番号が1つ増え、<b>8</b>になれば脱出。まちがえると<b>0</b>に戻ります。<br>
    ・操作: パソコンは WASD／矢印＋マウス。スマホは左で歩く・右で見回す。<br><br>
    <button class="btn sub" id="howZukan">見つけた異変を見る</button>
    <button class="btn sub" id="closeHow">とじる</button>
  </div></div>
  <div id="zukan"><div class="zwrap">
    <div class="zhead"><b>見つけた異変</b><span id="zCount"></span><button class="btn sub" id="zClose">とじる</button></div>
    <div id="zGrid"></div>
  </div></div>
</div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";

/* ===== 1. Sfx（効果音・環境音。すべて合成で、音源ファイルは使わない） =====
   本物らしさのための作り:
   - 響き: 木造アーケードの残響（1.6秒の減衰ノイズを畳み込み）。足音・風鈴・判定音を少しずつ送る
   - 足音: 石畳の「かかと（硬い短い音）→ つま先のこすれ → 余韻」を毎歩少しずつ変え、左右の足で定位をずらす
   - 環境音: 夕暮れの空気（低めの帯域ノイズ）＋高窓のすきま風（ゆっくり揺れる帯域）
   - 風鈴: お店の軒先に2つ。立体音響（HRTF）で、近づくと大きく・向きで左右が変わる
   - 音はすべて master ゲインを通す（ミュートが効くように）。110Hz 未満は使わない（2D 版で重低音が耳障りと言われた） */
const Sfx = (() => {
  let ac = null, master = null, verb = null, verbIn = null, noiseBuf = null, amb = null, foot = 0;
  const flags = { furinSilent: false, noEcho: false };   // 音の異変（風鈴が鳴らない・足音が響かない）
  let muted = false;
  try { muted = localStorage.getItem("mochi-exit-3d:muted") === "1"; } catch (e) {}
  function impulse(sec, decay) {                     // 残響の素（左右で別のノイズ・前半に初期反射）
    const n = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, n, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) { const t = i / n; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < ac.sampleRate * 0.03 ? 0.4 : 1); }
      [0.011, 0.019, 0.027, 0.041].forEach((s, k) => { const i = Math.floor(s * ac.sampleRate) + ch * 37; if (i < n) d[i] += 0.6 / (k + 1); });
    }
    return buf;
  }
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      verbIn = ac.createGain(); verb = ac.createConvolver(); verb.buffer = impulse(1.6, 3.2);
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 180;   // 響きの低音は濁るので切る
      const vg = ac.createGain(); vg.gain.value = 0.55; verbIn.connect(hp); hp.connect(verb); verb.connect(vg); vg.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (ac.listener.forwardX) { ac.listener.upY.value = 1; }
    }
    if (ac.state === "suspended") ac.resume();
    return true;
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function out(node, dry, wet, pan = 0) {            // 乾いた音と響きへの送り
    const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const g = ac.createGain(); g.gain.value = dry; const s = ac.createGain(); s.gain.value = wet;
    if (p) { p.pan.value = pan; node.connect(p); p.connect(g); p.connect(s); } else { node.connect(g); node.connect(s); }
    g.connect(master); s.connect(verbIn);
  }
  function noiseHit(t, { f, q = 1, type = "bandpass", attack = 0.002, decay = 0.05, gain = 0.3, hp = 150, dry = 1, wet = 0.2, pan = 0, rate = 1 }) {
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = rate;
    const h = ac.createBiquadFilter(); h.type = "highpass"; h.frequency.value = hp;
    const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
    const e = ac.createGain(); e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(gain, t + attack); e.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    src.connect(h); h.connect(b); b.connect(e); out(e, dry, wet, pan);
    src.start(t, Math.random() * 1.5); src.stop(t + attack + decay + 0.05);
  }
  function tone(t, f, { type = "sine", attack = 0.003, decay = 1, gain = 0.1, dry = 1, wet = 0.3, pan = 0, dest = null }) {
    const o = ac.createOscillator(), e = ac.createGain(); o.type = type; o.frequency.value = f;
    e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(gain, t + attack); e.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(e); if (dest) e.connect(dest); else out(e, dry, wet, pan);
    o.start(t); o.stop(t + attack + decay + 0.05);
  }
  // おりん・風鈴のような金属の余韻（倍音が整数倍でない＝金属らしさ）
  function bell(t, f0, ratios, gains, decay, level, opts = {}) {
    ratios.forEach((r, k) => tone(t, f0 * r * rnd(0.998, 1.002), Object.assign({ decay: decay * (1 - k * 0.15), gain: level * gains[k], attack: 0.002 }, opts)));
  }
  // 風鈴: 舌が当たる「ち」という小さな打音＋ガラスの余韻。dest に立体音響の panner を渡す
  function chime(dest, level) {
    const t = ac.currentTime + 0.01, f0 = rnd(2350, 2650);
    const tick = ac.createBufferSource(); tick.buffer = noiseBuf;
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 4200;
    const e = ac.createGain(); e.gain.setValueAtTime(level * 0.5, t); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
    tick.connect(hp); hp.connect(e); e.connect(dest); tick.start(t, Math.random()); tick.stop(t + 0.03);
    [1, 2.32, 4.25, 6.8].forEach((r, k) => tone(t, f0 * r * rnd(0.997, 1.003), { decay: 2.2 - k * 0.4, gain: level * [0.5, 0.22, 0.12, 0.05][k], dest }));
    if (Math.random() < 0.6) setTimeout(() => amb && chime(dest, level * rnd(0.4, 0.7)), rnd(140, 420));   // 揺れて続けて鳴る
  }
  function positional(x, y, z) {
    const p = ac.createPanner(); p.panningModel = "HRTF"; p.distanceModel = "inverse"; p.refDistance = 1.2; p.rolloffFactor = 1.1; p.maxDistance = 40;
    if (p.positionX) { p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x, y, z);
    const s = ac.createGain(); s.gain.value = 0.35; p.connect(master); p.connect(s); s.connect(verbIn); return p;
  }
  function loopNoise(filters, gain) {
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    let node = src; filters.forEach((f) => { node.connect(f); node = f; });
    const g = ac.createGain(); g.gain.value = 0; node.connect(g); g.gain.linearRampToValueAtTime(gain, ac.currentTime + 1.5);
    g.connect(master); src.start(); return { src, g };
  }
  function filt(type, f, q = 0.7) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
  return {
    ensure, flags,
    // 石畳の足音（左右の足で定位と音色を変える）
    step() {
      if (!ensure()) return; const t = ac.currentTime + 0.005, side = (foot ^= 1) ? -0.14 : 0.14, v = rnd(0.8, 1.15), e = flags.noEcho ? 0 : 1;
      noiseHit(t, { f: rnd(1500, 2100), q: 1.1, attack: 0.0015, decay: rnd(0.035, 0.05), gain: 0.28 * v, hp: 300, wet: 0.22 * e, pan: side });          // かかと
      tone(t, rnd(150, 175), { decay: 0.045, gain: 0.07 * v, attack: 0.002, wet: 0.05 * e, pan: side });                                                     // 体重の乗る鈍い音（110Hz より上）
      noiseHit(t + rnd(0.07, 0.1), { f: rnd(2600, 3400), type: "lowpass", q: 0.5, attack: 0.006, decay: rnd(0.07, 0.11), gain: 0.07 * v, hp: 500, wet: 0.15 * e, pan: side });   // つま先のこすれ
    },
    // 正解: おりんの「ちーん」
    good() { if (!ensure()) return; const t = ac.currentTime + 0.02; bell(t, 742, [1, 2.71, 5.15], [0.6, 0.25, 0.08], 2.6, 0.13, { wet: 0.45 }); },
    // 不正解: 木の「こつ、こつ」（拍子木を小さく）
    bad() {
      if (!ensure()) return; const t = ac.currentTime + 0.02;
      [0, 0.19].forEach((d) => { noiseHit(t + d, { f: 1150, q: 6, attack: 0.001, decay: 0.07, gain: 0.32, hp: 400, wet: 0.35 }); tone(t + d, 1060, { decay: 0.06, gain: 0.06, wet: 0.3 }); });
    },
    // 脱出: 風鈴の連なり＋おりん
    clear() {
      if (!ensure()) return; const t = ac.currentTime + 0.05;
      bell(t, 742, [1, 2.71, 5.15], [0.6, 0.25, 0.08], 3, 0.12, { wet: 0.5 });
      [0.25, 0.45, 0.6, 0.9, 1.15].forEach((d, k) => bell(t + d, rnd(2300, 2700), [1, 2.32, 4.25], [0.4, 0.15, 0.06], 1.8, 0.07, { wet: 0.5, pan: k % 2 ? 0.3 : -0.3 }));
    },
    // 通路に入ったら環境音と風鈴を鳴らし始める（2つの風鈴は左のお店の軒先）
    startAmbience(chimes) {
      if (!ensure() || amb) return;
      const room = loopNoise([filt("highpass", 130), filt("lowpass", 850)], 0.035);
      const windBp = filt("bandpass", 650, 1.6), wind = loopNoise([filt("highpass", 300), windBp], 0.018);
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 260; lfo.connect(lg); lg.connect(windBp.frequency); lfo.start();
      const pans = chimes.map(([x, y, z]) => positional(x, y, z));
      amb = { room, wind, lfo, pans, timers: [] };
      pans.forEach((p, k) => { const loop = () => { if (!amb) return; if (!flags.furinSilent) chime(p, 0.12); amb.timers[k] = setTimeout(loop, rnd(3500, 9000)); }; amb.timers[k] = setTimeout(loop, 800 + k * 2300); });
    },
    stopAmbience() {
      if (!amb) return; const a = amb; amb = null; a.timers.forEach(clearTimeout);
      [a.room, a.wind].forEach(({ src, g }) => { g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.8); src.stop(ac.currentTime + 0.9); });
      a.lfo.stop(ac.currentTime + 0.9);
    },
    // 聞いている位置と向き（カメラと同じ）
    listen(x, y, z, yaw) {
      if (!ac) return; const L = ac.listener, fx = -Math.sin(yaw), fz = -Math.cos(yaw);
      if (L.positionX) { L.positionX.value = x; L.positionY.value = y; L.positionZ.value = z; L.forwardX.value = fx; L.forwardY.value = 0; L.forwardZ.value = fz; }
      else { L.setPosition(x, y, z); L.setOrientation(fx, 0, fz, 0, 1, 0); }
    },
    get muted() { return muted; },
    get ambient() { return !!amb; },
    setMuted(m) { muted = m; try { localStorage.setItem("mochi-exit-3d:muted", m ? "1" : "0"); } catch (e) {} if (master) master.gain.value = m ? 0 : 1; }
  };
})();

/* ===== 2. Renderer / 定数 ===== */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const camera = new THREE.PerspectiveCamera(70, 1, 0.15, 45);   // 壁際の飾りは 5〜8mm しか離れておらず、手前を切る距離が近いと遠くで面が競り合ってちらつく。壁には 0.3m までしか寄れないので 0.15 で足りる（霧は 30m で終わる）
camera.rotation.order = "YXZ";
// 描画倍率は端末に合わせて自動調整する（Quality）。描く点の数は倍率の2乗で増えるので、
// 1秒ごとに滑らかさを測り、カクつけば下げ・余裕があれば最大2倍まで上げる。テクスチャは1回作って使い回すので負担にならない
const Quality = { max: Math.min(window.devicePixelRatio || 1, 2), min: 0.5, pr: Math.min(window.devicePixelRatio || 1, 1.5), frames: 0, acc: 0, skip: 0, fps: 0 };
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Quality.pr); renderer.setSize(w, h, false); camera.aspect = w / h;
  // 縦長画面では横の視野が狭くなり、左右のお店や扉が画面外に出る。横 62° を下回らないよう縦の視野角を広げる（上限 100°）
  const needV = 2 * Math.atan(Math.tan((62 * Math.PI / 180) / 2) / camera.aspect) * 180 / Math.PI;
  camera.fov = Math.max(70, Math.min(100, needV));
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();
function tuneQuality(dt) {
  if (Quality.skip > 0) { Quality.skip -= dt; return; }            // 通路の作り直し直後は測らない
  Quality.frames++; Quality.acc += dt;
  if (Quality.acc < 1) return;
  const fps = Quality.frames / Quality.acc; Quality.frames = 0; Quality.acc = 0; Quality.fps = Math.round(fps);
  // 倍率を変えるたびに描画バッファを作り直すので、その1コマが止まり視点が飛んで見える。
  // 上げ下げを繰り返さないよう、下げたら20秒はその倍率より上げず、上げるのは余裕が3秒続いたときだけにする
  let next = Quality.pr; Quality.hold = Math.max(0, (Quality.hold || 0) - 1);
  if (fps < 45) { next = Math.max(Quality.min, Quality.pr * 0.85); Quality.hold = 20; Quality.good = 0; }

  const glass = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), new THREE.MeshStandardMaterial({ color: 0xe8f6ff, roughness: 0.05, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
  grp.add(glass);
  const paint = new THREE.Mesh(new THREE.SphereGeometry(0.056, 20, 6, 0, Math.PI * 2, Math.PI * 0.32, Math.PI * 0.12), col(k ? 0x2a6fd6 : 0xd8342c, { roughness: 0.3 })); grp.add(paint);   // 金魚・波を思わせる色の帯
  grp.add(box(0.003, 0.09, 0.003, col(0xdddddd), 0, -0.05, 0));                                                    // 舌をつるす糸
  const tan = new THREE.Mesh(new THREE.PlaneGeometry(0.065, 0.24), col(k ? 0xf2d14a : 0xf08aa8, { roughness: 0.9, side: THREE.DoubleSide })); tan.position.y = -0.21; grp.add(tan);   // 短冊
  grp.add(box(0.003, 0.14, 0.003, col(0xdddddd), 0, 0.12, 0));
  g.add(grp); return grp;
}

// 売り台（お店ごとに形を変える。どの店に何があったかを覚える手がかりにもなる）
// 0=木の箱台＋赤い毛氈 1=ガラスのショーケース 2=赤い布を掛けた縁台＋かご 3=2段のひな壇 4=樽の上に板を渡した台
const COUNTER_STYLE = [0, 1, 2, 3, 4, 1, 3, 0, 4, 2];
function counter(g, style, i, x, z, wB) {
  const cg = new THREE.Group(), items = []; g.add(cg);
  const W = wB - 0.6, wood = (c, ry = 0.5) => std(texOf(sharedCanvases().wood, 1, ry), { roughness: 0.5, color: c });
  const felt = col(0xa8261f, { roughness: 0.95 });
  const place = (y, xs, dzs) => dzs.forEach((dz, k) => { const it = goods(i % 4, k); it.position.set(xs[k] ?? xs[0], y, z + dz); cg.add(it); items.push(it); });
  if (style === 0) {
    cg.add(box(0.5, 0.85, W, wood(0xb08060), x, 0.425, z), box(0.44, 0.006, W - 0.1, felt, x, 0.853, z));
    place(0.856, [x], [-0.45, 0.45]);
  } else if (style === 1) {
    cg.add(box(0.52, 0.62, W, wood(0x6e4426), x, 0.31, z));
    cg.add(box(0.5, 0.02, W - 0.02, col(0xf2ece0, { roughness: 0.6 }), x, 0.63, z));
    const glass = new THREE.MeshStandardMaterial({ color: 0xdff2f7, roughness: 0.05, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide });
    cg.add(box(0.5, 0.34, W - 0.02, glass, x, 0.81, z));
    const frame = col(0x3a2414, { roughness: 0.4 });
    [[0.25, 0.81, W / 2], [-0.25, 0.81, W / 2], [0.25, 0.81, -W / 2], [-0.25, 0.81, -W / 2]].forEach(([dx, y, dz]) => cg.add(box(0.025, 0.36, 0.025, frame, x + dx, y, z + dz)));
    cg.add(box(0.52, 0.025, W, frame, x, 0.985, z));
    place(0.64, [x], [-0.4, 0.4]);
  } else if (style === 2) {
    cg.add(box(0.7, 0.42, W + 0.1, wood(0x9a6a44), x - 0.05, 0.21, z));
    cg.add(box(0.72, 0.012, W + 0.14, felt, x - 0.05, 0.426, z), box(0.012, 0.3, W + 0.14, felt, x + 0.31, 0.29, z));   // 前に垂らした布
    const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.12, 24, 1, true), col(0xc29a5a, { roughness: 0.9, side: THREE.DoubleSide }));
    basket.position.set(x - 0.1, 0.49, z + 0.45); cg.add(basket);
    place(0.432, [x - 0.1], [-0.45]);
    const it = goods(i % 4, 1); it.position.set(x - 0.1, 0.44, z + 0.45); it.scale.setScalar(0.8); cg.add(it); items.push(it);
  } else if (style === 3) {
    cg.add(box(0.5, 0.55, W, wood(0xa87a54), x, 0.275, z), box(0.24, 0.32, W, wood(0x8a5e3c), x - 0.13, 0.71, z));
    cg.add(box(0.26, 0.006, W - 0.1, felt, x + 0.12, 0.553, z), box(0.22, 0.006, W - 0.1, felt, x - 0.13, 0.873, z));
    place(0.556, [x + 0.12], [-0.45]); place(0.876, [x - 0.13], [0.45]);
  } else {
    [-0.55, 0.55].forEach((dz) => {
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.19, 0.74, 20), wood(0x9a6c40, 1)); barrel.position.set(x, 0.37, z + dz); cg.add(barrel);
      [0.12, 0.62].forEach((y) => { const hoop = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.205, 0.03, 20), col(0x2a2622, { roughness: 0.4, metalness: 0.6 })); hoop.position.set(x, y, z + dz); cg.add(hoop); });
    });
    cg.add(box(0.5, 0.05, W + 0.2, wood(0xc49a6a), x, 0.765, z));
    place(0.79, [x], [-0.45, 0.45]);
  }
  return { group: cg, goods: items };
}

// 売り台の商品（お店の種類 type: 0=もち 1=茶 2=飴 3=団子、k: 左右どちらの品か）。数は少なく、形と質感で本物らしく
function goods(type, k) {
  const grp = new THREE.Group();
  const lacquer = col(k ? 0x1a1210 : 0x6e1a14, { roughness: 0.25 });
  const sph = (r, color, x, y, z, sy = 1, rough = 0.6) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), col(color, { roughness: rough })); m.scale.y = sy; m.position.set(x, y, z); grp.add(m); return m; };
  if (type === 3 || (type === 0 && k)) {               // 三色団子（団子屋・もち屋の片側）
    grp.add(box(0.2, 0.012, 0.34, lacquer, 0, 0.006, 0));
    grp.userData.skewers = [-0.09, 0, 0.09].map((dz) => {
      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.17, 6), col(0xd9c08a)); stick.rotation.z = Math.PI / 2; stick.position.set(0, 0.035, dz); grp.add(stick);
      return [stick, ...[0xf2a7b8, 0xf7f3ea, 0x8fbf6a].map((c, n) => sph(0.026, c, -0.05 + n * 0.05, 0.036, dz, 0.95, 0.75))];
    });
  } else if (type === 0) {                             // 大福（白と薄桃）
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.016, 28), lacquer); plate.position.y = 0.008; grp.add(plate);
    [[0, 0], [0.07, 0.06], [-0.07, 0.06], [0.07, -0.06], [-0.07, -0.06]].forEach(([x, z], n) => sph(0.042, n === 0 ? 0xf6c9cf : 0xfbf8f2, x, 0.04, z, 0.68, 0.95));
  } else if (type === 1) {                             // 茶筒と湯のみ
    const label = std(texOf(sharedCanvases().teaLabel), { roughness: 0.4 });
    [-0.08, 0.06].forEach((dz, n) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.14 + n * 0.03, 24), label); c.position.set(0, 0.07 + n * 0.015, dz); grp.add(c); });
    const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, 0.05, 20), col(0xe9dcc2, { roughness: 0.35 })); cup.position.set(0.05, 0.025, 0.17); grp.add(cup);
  } else {                                             // 飴の瓶（ガラス越しに色とりどりの飴）
    const candy = [0xe8463c, 0xf5c542, 0x7cc576, 0xf2f2f2];
    [-0.07, 0.07].forEach((dz, n) => {
      for (let c = 0; c < 9; c++) sph(0.016, candy[(c + n) % 4], Math.cos(c * 2.1) * 0.03, 0.02 + (c % 3) * 0.03, dz + Math.sin(c * 2.1) * 0.03, 1, 0.3);
      const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.15, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0xd8eef5, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide }));
      jar.position.set(0, 0.075, dz); grp.add(jar);
      const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.025, 24), col(0x8a5a30, { roughness: 0.5 })); lid.position.set(0, 0.162, dz); grp.add(lid);
    });
  }
  return grp;
}

function buildHall(signNum) {
  const C = sharedCanvases();
  const s = { group: new THREE.Group(), scene: new THREE.Scene() };
  const scene = s.scene; scene.background = new THREE.Color(0x1c1410); scene.fog = new THREE.Fog(0x2a1f1a, 10, 30);
  scene.add(s.group);
  const g = s.group, W2 = HALL_W / 2, L2 = HALL_L / 2;
  const timberZ = std(texOf(C.timber, 1, 3), { roughness: 0.6 });                 // 縦に長い材（柱）
  const timberX = std(texOf(C.timber, 1, 2), { roughness: 0.6, color: 0xc8b8a8 }); // 梁など
  const dark = col(0x2a1a10, { roughness: 0.6 });

  const EXT = 4 * BAY, LL = HALL_L + 2 * EXT, FADE_N = 8, FADE_COL = 0x1c1410;   // 両端の先へ伸ばす長さ・暗幕の枚数と色
  // 石畳
  g.add(plane(HALL_W, LL, std(texOf(C.stone, HALL_W / 2, LL / 2), { roughness: 0.55 }), 0, 0, 0, 0, -Math.PI / 2));
  // 切妻屋根（野地板）・棟木・母屋
  const slope = Math.atan2(RIDGE_H - EAVE_H, W2), rl = Math.hypot(W2, RIDGE_H - EAVE_H) + 0.05;
  [-1, 1].forEach((sg) => {
    const roof = plane(rl, LL, std(texOf(C.plank, rl / 2, LL / 2), { roughness: 0.8, side: THREE.DoubleSide }), sg * W2 / 2, (EAVE_H + RIDGE_H) / 2, 0, 0, 0);
    roof.rotation.order = "ZXY"; roof.rotation.set(Math.PI / 2, 0, -sg * slope);   // 水平に寝かせてから、棟から軒へ下がるよう傾ける
    g.add(roof);
    g.add(box(0.12, 0.14, LL, timberX, sg * W2 * 0.5, EAVE_H + (RIDGE_H - EAVE_H) * 0.5 - 0.1, 0));    // 母屋
  });
  g.add(box(0.16, 0.18, LL, timberX, 0, RIDGE_H - 0.1, 0));                                           // 棟木
  // 柱・梁・束（BAY ごと）
  for (let z = L2 + EXT; z >= -L2 - EXT - 0.01; z -= BAY) {
    [-W2 + 0.09, W2 - 0.09].forEach((x) => g.add(box(0.18, EAVE_H, 0.18, timberZ, x, EAVE_H / 2, z)));
    g.add(box(HALL_W, 0.22, 0.16, timberX, 0, EAVE_H - 0.1, z));                                            // 梁
    g.add(box(0.12, RIDGE_H - EAVE_H, 0.12, timberX, 0, (EAVE_H + RIDGE_H) / 2, z));                        // 束
    [-1, 1].forEach((sg) => { const b = box(0.08, Math.hypot(W2 * 0.5, RIDGE_H - EAVE_H), 0.08, timberX, sg * W2 * 0.25, (EAVE_H + RIDGE_H) / 2 - 0.05, z); b.rotation.z = sg * Math.atan2(W2 * 0.5, RIDGE_H - EAVE_H); g.add(b); });
  }
  // 高窓（左右・壁の上から軒まで）
  const skyMat = new THREE.MeshBasicMaterial({ map: texOf(C.sky, LL / 4, 1), fog: false }); s.skyMat = skyMat;
  [[-W2 + 0.01, Math.PI / 2], [W2 - 0.01, -Math.PI / 2]].forEach(([x, ry]) => g.add(plane(LL, EAVE_H - WALL_H - 0.12, skyMat, x, (WALL_H + EAVE_H - 0.12) / 2, 0, ry)));

  // 右側: 漆喰の壁＋腰板＋巾木
  s.wallR = plane(LL, WALL_H, std(texOf(C.wall, LL / 2, WALL_H / 2), { roughness: 0.85 }), W2 - 0.005, WALL_H / 2, 0, -Math.PI / 2); g.add(s.wallR);
  g.add(plane(LL, 0.9, std(texOf(C.wood, LL / 2, 0.9), { roughness: 0.55 }), W2 - 0.012, 0.45, 0, -Math.PI / 2));
  g.add(box(0.04, 0.05, LL, dark, W2 - 0.02, 0.92, 0), box(0.03, 0.09, LL, dark, W2 - 0.02, 0.045, 0), box(0.06, 0.1, LL, timberX, W2 - 0.03, WALL_H, 0));
  const shadeMat = new THREE.MeshBasicMaterial({ map: texOf(C.shade), transparent: true, depthWrite: false });
  g.add(plane(LL, 0.5, shadeMat, W2 - 0.02, WALL_H - 0.25, 0, -Math.PI / 2));
  const sb = plane(LL, 0.3, shadeMat, W2 - 0.02, 0.15, 0, -Math.PI / 2); sb.rotation.z = Math.PI; g.add(sb);
  // 両端の先: 突き当たりの壁は置かず、通路がその先へ続いて見えるようにする。
  // 左側はお店の代わりに閉じた雨戸（板）で続け、奥へ行くほど半透明の暗幕を重ねて徐々に暗く溶かす（壁に見えないように。2026-11-02 ユーザー指摘）
  [-1, 1].forEach((sg) => {
    g.add(plane(EXT, WALL_H, std(texOf(C.wood, EXT / 2, 1.3), { roughness: 0.7, color: 0x7a5a42 }), -W2 + 0.01, WALL_H / 2, sg * (L2 + EXT / 2), Math.PI / 2));
    for (let k = 1; k <= FADE_N; k++) {
      const m = new THREE.MeshBasicMaterial({ color: FADE_COL, transparent: true, opacity: k === FADE_N ? 1 : 0.22, depthWrite: false, fog: false, side: THREE.DoubleSide });
      g.add(plane(HALL_W + 0.2, RIDGE_H + 0.2, m, 0, (RIDGE_H + 0.2) / 2, sg * (L2 + 0.6 + (k - 1) * (EXT - 1) / (FADE_N - 1))));
    }
  });

  // 左側: お店（区画ごとに 奥の棚・売り台・のれん・瓦の庇）
  const back = -W2 - 1.1;
  s.shops = [];
  BAYS.forEach((z, i) => {
    const wB = BAY - 0.18, shop = { z, noren: [] }; s.shops.push(shop);
    const shopTex = texOf(C.shop[i % 4]);
    shop.backMat = new THREE.MeshStandardMaterial({ map: shopTex, emissiveMap: shopTex, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.9 });
    g.add(plane(wB, WALL_H, shop.backMat, back, WALL_H / 2, z, Math.PI / 2));
    g.add(plane(1.1, wB, std(texOf(C.wood, 0.55, 1.2), { roughness: 0.7, color: 0x8a6a50 }), -W2 - 0.55, 0.004, z, 0, -Math.PI / 2));   // お店の床
    [z - wB / 2, z + wB / 2].forEach((zz, k) => g.add(plane(1.1, WALL_H, std(texOf(C.wood, 0.55, 1.4), { roughness: 0.7, color: 0x9a7458 }), -W2 - 0.55, WALL_H / 2, zz, k ? Math.PI : 0)));
    g.add(plane(1.1, wB, std(texOf(C.plank, 0.55, 1.3), { roughness: 0.8 }), -W2 - 0.55, WALL_H - 0.3, z, 0, Math.PI / 2));             // お店の天井
    g.add(box(0.06, 0.3, wB, std(texOf(C.wood, 1, 0.3)), -W2 + 0.03, WALL_H - 0.15, z));                                                 // 上の鴨居
    // 売り台と商品
    const cnt = counter(g, COUNTER_STYLE[i % COUNTER_STYLE.length], i, -W2 - 0.4, z, wB); shop.counter = cnt.group; shop.goods = cnt.goods;
    // のれん: 3枚に割れた布。お店ごとに長さ・藍の濃さ・揺れ方を変え、しわ（波打ち）で光の当たり方に濃淡を出す
    {
      const nr = rng(100 + i), nh = 0.46 + nr() * 0.26, top = WALL_H - 0.27, tot = wB - 0.3, gap = 0.012, pw = (tot - 2 * gap) / 3;
      const nMat = new THREE.MeshStandardMaterial({ map: texOf(C.noren[i % 4]), roughness: 0.95, side: THREE.DoubleSide, color: new THREE.Color().setHSL(0.6, 0.12 * nr(), 0.78 + nr() * 0.22) });
      const swing = (nr() - 0.5) * 0.05; shop.norenMat = nMat; shop.nh = nh; shop.top = top;
      for (let k = 0; k < 3; k++) {
        const geo = new THREE.PlaneGeometry(pw, nh, 12, 6), pos = geo.attributes.position, uv = geo.attributes.uv, ph = nr() * 6;
        for (let v = 0; v < pos.count; v++) {
          const x = pos.getX(v), y = pos.getY(v), down = (nh / 2 - y) / nh;          // 0=上端 1=すそ
          pos.setZ(v, Math.sin(x * 38 + ph) * 0.008 * (0.4 + down) + swing * down * down);
          uv.setX(v, (k * (pw + gap) + (x + pw / 2)) / tot);
          uv.setY(v, 1 - (1 - uv.getY(v)) * (nh / 0.72));                             // 短いのれんは すそ側が切れる（文字の位置は揃える）
        }
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, nMat); m.rotation.y = Math.PI / 2;
        m.position.set(-W2 + 0.07, top - nh / 2, z + tot / 2 - pw / 2 - k * (pw + gap)); g.add(m); shop.noren.push(m);
      }
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, tot + 0.1, 8), col(0xb89a5a, { roughness: 0.5 })); pole.rotation.x = Math.PI / 2; pole.position.set(-W2 + 0.07, top + 0.01, z); g.add(pole); shop.pole = pole;
    }
    // 瓦の庇
    // 板の向き: 横（u）が通路に沿い、縦（v）が軒先へ下がる。上面は瓦・下面は木の軒裏
    const tilt = 0.42, depth = 0.8, ex = -W2 + Math.cos(tilt) * depth / 2, ey = WALL_H + 0.12 - Math.sin(tilt) * depth / 2;
    const basis = new THREE.Matrix4().makeBasis(new THREE.Vector3(0, 0, -1), new THREE.Vector3(-Math.cos(tilt), Math.sin(tilt), 0), new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0));
    const eave = plane(BAY, depth, std(texOf(C.kawara, BAY / 0.3, 1.6), { roughness: 0.45 }), ex, ey, z); eave.quaternion.setFromRotationMatrix(basis); g.add(eave);
    const soffit = plane(BAY, depth, std(texOf(C.plank, BAY / 2, 0.4), { roughness: 0.8, side: THREE.BackSide }), ex, ey - 0.012, z); soffit.quaternion.copy(eave.quaternion); g.add(soffit);
    const edge = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, BAY, 12), col(0x3a414c, { roughness: 0.35 }));   // 軒先の瓦の縁
    edge.rotation.x = Math.PI / 2; edge.position.set(-W2 + Math.cos(tilt) * depth, WALL_H + 0.12 - Math.sin(tilt) * depth, z); g.add(edge);
  });
  // 看板「もち屋」（庇の先から吊る）
  g.add(plane(1.0, 0.31, std(texOf(C.shopSign), { roughness: 0.5, side: THREE.DoubleSide }), -W2 + 0.66, WALL_H - 0.32, BAYS[5], Math.PI / 2));

  // ポスター（右の壁・木の額）
  s.posters = [];
  [BAYS[1], BAYS[4], BAYS[5], BAYS[8]].forEach((z, i) => {
    const pivot = new THREE.Group(); pivot.position.set(W2 - 0.03, 1.6, z); pivot.rotation.y = -Math.PI / 2;
    pivot.add(box(0.8, 1.15, 0.04, col(0x4a2c18, { roughness: 0.45 }), 0, 0, -0.005));
    pivot.add(plane(0.7, 1.05, std(texOf(C.posters[i]), { roughness: 0.32 }), 0, 0, 0.018));
    g.add(pivot); s.posters.push(pivot);
  });
  // 扉（右の壁・枠＋鏡板＋真鍮の取っ手。蝶番で回る）
  s.doors = []; s.doorKnobs = [];
  [BAYS[2], BAYS[6]].forEach((z) => {
    g.add(box(0.07, 2.25, 1.16, dark, W2 - 0.035, 1.125, z));
    const hinge = new THREE.Group(); hinge.position.set(W2 - 0.08, 0, z + 0.45); hinge.rotation.y = Math.PI;
    hinge.add(box(0.05, 2.1, 0.9, std(texOf(C.wood, 0.5, 2.2), { roughness: 0.45, color: 0xd08a5e }), 0, 1.05, 0.45));
    [0.62, 1.5].forEach((y) => hinge.add(box(0.02, 0.62, 0.62, col(0x7a3a1c, { roughness: 0.4 }), 0.03, y, 0.45)));
    const knob = box(0.06, 0.16, 0.05, new THREE.MeshStandardMaterial({ color: 0xe8b84a, roughness: 0.3, metalness: 0.35 }), 0.04, 1.0, 0.8); hinge.add(knob); s.doorKnobs.push(knob);   // 金属感を強くすると環境の映り込みが無いので真っ黒に見える
    g.add(hinge); s.doors.push(hinge);
  });

  // 吊り下げ灯（梁から）＋点光源
  s.lights = []; s.panels = [];
  [10.4, 5.2, 0, -5.2, -10.4].forEach((z) => {
    g.add(box(0.012, 0.5, 0.012, dark, 0, EAVE_H - 0.45, z));
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.2, 20, 1, true), col(0x2a2018, { roughness: 0.5, side: THREE.DoubleSide })); shade.position.set(0, EAVE_H - 0.75, z); g.add(shade);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff1cc })); bulb.position.set(0, EAVE_H - 0.82, z); g.add(bulb); s.panels.push(bulb);
    const L = new THREE.PointLight(0xffd9a0, 7, 12, 1.3); L.position.set(0, EAVE_H - 0.9, z); g.add(L); s.lights.push(L);
  });

/* ===== 6. ゲーム状態 ===== */
const $ = (id) => document.getElementById(id);
const SCREENS = ["title", "play", "result"];
function show(name) { SCREENS.forEach((n) => $(n).classList.toggle("active", n === name)); }
const G = { phase: "title", exitNo: 0, round: 0, cur: null, anomaly: null, forced: undefined, used: new Set() };
const P = { x: 0, z: SPAWN_Z, yaw: 0, pitch: 0, stepAcc: 0 };

function allowedLevels(round) { return round < 3 ? [1] : round < 6 ? [1, 2] : [1, 2, 3]; }
function pickAnomaly(round) {
  if (G.forced !== undefined) { const id = G.forced; G.forced = undefined; return id ? ANOMALIES.find((a) => a.id === id) : null; }
  if (Math.random() > 0.6) return null;
  let pool = ANOMALIES.filter((a) => allowedLevels(round).includes(a.level));
  const fresh = pool.filter((a) => !G.used.has(a.id));
  if (!fresh.length) { pool.forEach((a) => G.used.delete(a.id)); } else pool = fresh;
  const a = pool[Math.floor(Math.random() * pool.length)]; G.used.add(a.id); return a;
}
function disposeScene(s) {
  if (!s) return;
  s.scene.traverse((o) => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (m.map && !m.map.userData.shared) m.map.dispose(); m.dispose(); });
  });
}
function makeScene(signNum, anomaly) {
  const s = buildHall(signNum); s.signNum = signNum;
  if (anomaly) anomaly.apply(s);
  return s;
}
function setScene(s) { disposeScene(G.cur); G.cur = s; Quality.skip = 0.6; Sfx.flags.furinSilent = s.furinSilent; Sfx.flags.noEcho = s.noEcho; }
function resetPlayer() { P.x = 0; P.z = SPAWN_Z; P.yaw = 0; P.pitch = 0; }

// 記録: 自己ベスト（タイム最速）と、見つけた異変（図鑑）。どちらも localStorage（使えない環境では記録しないだけで遊べる）
const Store = {
  get(k, d) { try { const v = localStorage.getItem("mochi-exit-3d:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mochi-exit-3d:" + k, JSON.stringify(v)); } catch (e) {} },
};
function fmtTime(ms) { const s = ms / 1000, m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`; }
function addFound(id) { const f = Store.get("found", []); if (!f.includes(id)) { f.push(id); Store.set("found", f); return true; } return false; }

let toastTimer = 0;
function toast(msg, ms = 1500) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms); }
function fadeThen(fn) { const f = $("fade"); f.style.opacity = 1; setTimeout(() => { fn(); f.style.opacity = 0; }, 230); }
function setExit(n) { G.exitNo = n; $("exitNo").textContent = n; }

function startGame() {
  Sfx.ensure(); Sfx.startAmbience(FURIN_POS); setExit(0); G.round = 0; G.used.clear(); G.anomaly = null; G.miss = 0; G.newFound = 0; G.t0 = 0;
  show("play"); G.phase = "intro";
  setScene(makeScene(0, null)); resetPlayer();
  $("hint").textContent = $("hint").dataset.t;
  const gd = $("guide"); gd.classList.remove("off"); gd.classList.toggle("on", matchMedia("(pointer:coarse)").matches);   // スマホだけ操作ガイドを出す（歩き出したら消える）
  toast("いつもの通路を覚えよう", 3200);
  G.running = true; last = performance.now(); const id = ++loopGen; requestAnimationFrame(t => loop(t, id));
}
function nextScene() {
  const final = G.exitNo >= 8;
  G.anomaly = final ? null : pickAnomaly(G.round);
  setScene(makeScene(G.exitNo, G.anomaly)); resetPlayer(); G.final = final;
}
function onEnd(dir) {                         // dir: "forward" | "back"
  if (G.busy) return;                         // フェード中は端を越えたままなので、二重判定を防ぐ
  G.busy = true; setTimeout(() => { G.busy = false; }, 600);
  if (G.phase === "intro") {
    G.phase = "play";
    fadeThen(() => { if (dir === "forward") { toast("ここから判定スタート", 1400); G.t0 = performance.now(); nextScene(); } else { setScene(makeScene(0, null)); resetPlayer(); } });
    return;
  }
  if (G.final && dir === "forward") { G.phase = "ended"; Sfx.clear(); Sfx.stopAmbience(); fadeThen(() => { G.running = false; showResult(performance.now() - G.t0); }); return; }
  const correct = G.anomaly ? dir === "back" : dir === "forward";
  G.round++;
  if (correct && G.anomaly && addFound(G.anomaly.id)) G.newFound++;
  if (correct) { setExit(G.exitNo + 1); Sfx.good(); toast("正解"); } else { setExit(0); G.miss++; Sfx.bad(); toast("不正解… 出口 0 に戻る", 1800); }
  fadeThen(nextScene);
}

function showResult(ms) {
  const best = Store.get("best", null), isNew = !best || ms < best.timeMs;
  if (isNew) Store.set("best", { timeMs: ms, miss: G.miss });
  const b = isNew ? { timeMs: ms, miss: G.miss } : best, found = Store.get("found", []).length;
  $("resultInfo").innerHTML =
    `タイム <b>${fmtTime(ms)}</b>${isNew ? '<span class="new">自己ベスト更新！</span>' : ""}<br>` +
    `ミス <b>${G.miss}</b> 回<br>` +
    `<small>自己ベスト ${fmtTime(b.timeMs)}（ミス ${b.miss}）</small><br>` +
    `見つけた異変 <b>${found}</b> / ${ANOMALIES.length}${G.newFound ? `　<small>今回 +${G.newFound}</small>` : ""}`;
  show("result");
}
// 図鑑: 見つけた異変は、その場面の画像と説明を出す。未発見は「？？？」と難しさの●だけ（答えを先に教えない）
const ZUKAN_VIEW = { mochi_in_hall: [-3, 0], light_dead: [3, 0], door_open: [9.2, -0.45], poster_gone: [11.6, -0.5], extra_lantern: [-1.2, 0.45], wall_red: [3, -0.6], poster_flipped: [11.6, -0.5], sign_wrong_num: [-5.2, 0],
  noren_gone: [8, 0.5], counter_gone: [6.2, 0.9], puddle: [1.5, 0], barrel_center: [-1.5, 0], two_mochi: [0.8, 0], lanterns_red: [8.5, 0.35],
  noren_swap: [8.8, 0.9], showcase_empty: [11.2, 0.9], furin_silent: [6.0, 0.6], sky_night: [3, 0.5], poster_swap: [3.8, -0.8], shop_dark: [3.4, 0.9], extra_pillar: [6.5, -0.45],
  noren_short: [5.6, 0.9], dango_missing: [5.2, 1.1], menu_text: [-4.8, 1.0], door_knob: [-2.2, -0.8], poster_price: [10.4, -0.95], no_echo: [SPAWN_Z, 0], tanzaku_color: [6.0, 0.6], lamp_blue: [3, 0], stone_color: [6.4, 0] };
const zThumb = {};
function thumbOf(id) {
  if (zThumb[id]) return zThumb[id];
  const [z, yaw] = ZUKAN_VIEW[id] || [SPAWN_Z, 0], a = ANOMALIES.find((x) => x.id === id), s = makeScene(3, a);
  renderer.setPixelRatio(1); renderer.setSize(640, 400, false); camera.aspect = 1.6; camera.fov = 70; camera.updateProjectionMatrix();
  camera.position.set(0, EYE, z); camera.rotation.set(0, yaw, 0); renderer.render(s.scene, camera);
  const url = canvas.toDataURL("image/jpeg", 0.85); disposeScene(s); resize();
  if (G.cur && G.running) renderer.render(G.cur.scene, camera);
  zThumb[id] = Promise.resolve(url); return zThumb[id];
}
function openZukan() {
  const found = Store.get("found", []), grid = $("zGrid"); grid.innerHTML = "";
  $("zCount").textContent = `${found.length} / ${ANOMALIES.length}` + (found.length === ANOMALIES.length ? "　コンプリート！" : "");
  ANOMALIES.forEach((a) => {
    const el = document.createElement("div"); el.className = "zc"; const ok = found.includes(a.id), lv = "●".repeat(a.level) + "○".repeat(3 - a.level);
    el.innerHTML = ok ? `<div class="zq">…</div><p>${a.desc}<br><span class="lv">${lv}</span></p>` : `<div class="zq">？？？</div><p>まだ見つけていない<br><span class="lv">${lv}</span></p>`;
    grid.appendChild(el);
    if (ok) thumbOf(a.id).then((url) => { const im = new Image(); im.src = url; im.alt = a.desc; el.replaceChild(im, el.firstChild); });
  });
  $("zukan").classList.add("open");
}

/* ===== 7. 入力（PC: WASD/矢印+マウス / スマホ: 左スティック+右ドラッグ） ===== */
const keys = new Set(); const touch = { stick: null, look: null, vx: 0, vy: 0 };
addEventListener("keydown", (e) => { keys.add(e.code); });
addEventListener("keyup", (e) => { keys.delete(e.code); });
// 押したまま別の窓へ移る・Esc でマウスロックが外れる・タブが隠れると keyup が届かず、押していないのに進み続ける。
// そうなりうる場面では、押しているキーをすべて「離した」ことにする
function releaseAll() {
  keys.clear();
  if (touch.stick !== null) { touch.stick = null; touch.vx = touch.vy = 0; $("stick").style.display = "none"; $("knob").style.transform = ""; }
  touch.look = null;
}
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
document.addEventListener("pointerlockchange", () => { if (document.pointerLockElement !== canvas) releaseAll(); });
canvas.addEventListener("pointerdown", (e) => {
  if (G.phase === "title") return;
  if (e.pointerType === "mouse") { if (document.pointerLockElement !== canvas) lockMouse(); touch.mouse = true; return; }
  canvas.setPointerCapture(e.pointerId);
  if (e.clientX < innerWidth / 2 && touch.stick === null) {
    touch.stick = e.pointerId; touch.ox = e.clientX; touch.oy = e.clientY;
    const st = $("stick"); st.style.display = "block"; st.style.left = e.clientX + "px"; st.style.top = e.clientY + "px";
  } else if (touch.look === null) { touch.look = e.pointerId; touch.lx = e.clientX; touch.ly = e.clientY; }
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { if (document.pointerLockElement === canvas) mouseLook(e.movementX, e.movementY); return; }
  if (e.pointerId === touch.stick) {
    let dx = e.clientX - touch.ox, dy = e.clientY - touch.oy; const r = Math.hypot(dx, dy), m = 50;
    if (r > m) { dx = dx / r * m; dy = dy / r * m; }
    touch.vx = dx / m; touch.vy = dy / m; const k = $("knob"); k.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (e.pointerId === touch.look) {
    P.yaw -= (e.clientX - touch.lx) * 0.006; P.pitch = Math.max(-1.2, Math.min(1.2, P.pitch - (e.clientY - touch.ly) * 0.006));
    touch.lx = e.clientX; touch.ly = e.clientY;
  }
});
function endPointer(e) {
  if (e.pointerId === touch.stick) { touch.stick = null; touch.vx = touch.vy = 0; $("stick").style.display = "none"; $("knob").style.transform = ""; }
  if (e.pointerId === touch.look) touch.look = null;
}
canvas.addEventListener("pointerup", endPointer); canvas.addEventListener("pointercancel", endPointer); canvas.addEventListener("lostpointercapture", endPointer);
// マウスの視点操作。視点が飛ぶ原因は3つあり、それぞれ次のように抑える
// ・Windows の「ポインターの精度を高める」（加速）がかかると、速く振ったときだけ大きく回る → 加速なしの生の移動量を頼む
// ・ポインターロック中、ブラウザがまれに数百ピクセルの外れ値を1回だけ送ってくる（ロック直後や画面端） → 直近の動きと比べて桁違いの単発なら捨てる
// ・移動量をそのまま足すと、マウスの送信間隔と画面の書き換えがずれてガタつく → 溜めておき、毎コマ少しだけならして反映する
const mouse = { dx: 0, dy: 0, avg: 0, skip: 0, held: null };
function lockMouse() {
  if (!canvas.requestPointerLock) return;
  let p; try { p = canvas.requestPointerLock({ unadjustedMovement: true }); } catch (_) { p = null; }
  if (p && p.catch) p.catch(() => { try { canvas.requestPointerLock(); } catch (_) {} });   // 未対応の環境では普通のロック
}
document.addEventListener("pointerlockchange", () => { mouse.skip = 2; mouse.dx = mouse.dy = 0; mouse.avg = 0; mouse.held = null; });
function mouseLook(mx, my) {
  if (mouse.skip > 0) { mouse.skip--; return; }                    // ロック直後の数回は位置の飛びが混ざる
  const m = Math.hypot(mx, my);
  // 外れ値（ふだんの6倍超かつ200px超）はいったん保留し、次の1回も同じ向きに大きく動いていれば本当に速く振ったとみなして戻す。
  // ブラウザの外れ値は1回だけ単発で来るので捨てられ、素早く振り向く操作は取りこぼさない
  if (mouse.held) {
    const h = mouse.held; mouse.held = null;
    if (m > 30 && h.x * mx + h.y * my > 0) { mouse.dx += h.x; mouse.dy += h.y; mouse.avg = Math.max(mouse.avg, h.m); }
  }
  if (m > 200 && m > mouse.avg * 6 + 40) { mouse.held = { x: mx, y: my, m }; return; }
  mouse.avg = mouse.avg * 0.8 + m * 0.2;
  mouse.dx += mx; mouse.dy += my;
}
function applyMouse(dt) {
  const k = 1 - Math.exp(-dt / 0.018);                             // 約18msでならす（遅れは体感しにくい長さ）
  const ux = mouse.dx * k, uy = mouse.dy * k; mouse.dx -= ux; mouse.dy -= uy;
  P.yaw -= ux * 0.0022; P.pitch = Math.max(-1.2, Math.min(1.2, P.pitch - uy * 0.0022));
}

/* ===== 8. メインループ ===== */
let last = 0;
let loopErrors = 0, loopGen = 0;
function loop(now, id) {
  if (!G.running || id !== loopGen) return;               // 始め直す前の古いループは、ここで止まる（2本動いて2倍重くなるのを防ぐ）
  requestAnimationFrame(t => loop(t, id));                           // 先に次のコマを予約する（この下で例外が出てもゲームが止まらない）
  try { frame(now); } catch (e) { loopErrors++; if (loopErrors <= 3) console.error("loop error", e); }
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (Quality.dirty) { Quality.dirty = false; resize(); }
  let fx = 0, fy = 0;                                   // fx: 右+ / fy: 前+
  if (keys.has("KeyW") || keys.has("ArrowUp")) fy += 1; if (keys.has("KeyS") || keys.has("ArrowDown")) fy -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) fx += 1; if (keys.has("KeyA") || keys.has("ArrowLeft")) fx -= 1;
  applyMouse(dt);
  fx += touch.vx; fy -= touch.vy;
  const mag = Math.hypot(fx, fy); if (mag > 1) { fx /= mag; fy /= mag; }
  const speed = 2.3;
  if (G.phase === "intro" || G.phase === "play") {
    const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
    const dx = (-sy * fy + cy * fx) * speed * dt, dz = (-cy * fy - sy * fx) * speed * dt;
    P.x = Math.max(-HALL_W / 2 + 0.3, Math.min(HALL_W / 2 - 0.3, P.x + dx)); P.z += dz;
    const moved = Math.hypot(dx, dz); if (moved > 0) $("guide").classList.add("off"); P.stepAcc += moved; if (P.stepAcc > 0.75) { P.stepAcc = 0; Sfx.step(); }
    if (P.z < FRONT_Z) onEnd("forward"); else if (P.z > BACK_Z) onEnd("back");
  }
  camera.position.set(P.x, EYE + Math.sin(P.stepAcc * 8) * 0.012, P.z);
  camera.rotation.set(P.pitch, P.yaw, 0);
  if (G.cur && G.cur.furin) G.cur.furin.forEach((f, k) => { f.rotation.x = Math.sin(now / 700 + k * 2) * 0.1; f.rotation.z = Math.sin(now / 1100 + k) * 0.06; });
  Sfx.listen(P.x, EYE, P.z, P.yaw);
  if (G.cur) renderer.render(G.cur.scene, camera);
  tuneQuality(dt);
}

/* ===== 9. UI 結線 ===== */
$("hint").dataset.t = matchMedia("(pointer:coarse)").matches ? "左: 歩く　右: 見回す" : "WASD/矢印: 歩く　マウス: 見回す（クリックで操作開始）";
$("startBtn").addEventListener("pointerdown", startGame);
$("againBtn").addEventListener("pointerdown", startGame);
// 一度クリアするまでは、異変が全部でいくつあるか（図鑑）を見せない（8番出口と同じ。2026-11-02 ユーザー指定）
$("howBtn").addEventListener("pointerdown", () => { $("howZukan").style.display = Store.get("best", null) ? "" : "none"; $("modal").classList.add("open"); });
$("closeHow").addEventListener("pointerdown", () => $("modal").classList.remove("open"));
$("zukanBtn").addEventListener("pointerdown", openZukan);
$("howZukan").addEventListener("pointerdown", () => { $("modal").classList.remove("open"); openZukan(); });
$("zClose").addEventListener("pointerdown", () => $("zukan").classList.remove("open"));
const muteBtn = $("muteBtn"); const syncMute = () => { muteBtn.textContent = Sfx.muted ? "🔇" : "🔊"; }; syncMute();
muteBtn.addEventListener("pointerdown", (e) => { e.stopPropagation(); Sfx.ensure(); Sfx.setMuted(!Sfx.muted); syncMute(); });

/* ===== 10. テストフック ===== */
window.__exit3d = {
  anomalies: ANOMALIES.map((a) => ({ id: a.id, level: a.level, desc: a.desc })),
  store: Store, showResult, openZukan, ambient: () => Sfx.ambient, zukanView: ZUKAN_VIEW,
  info: () => ({ textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries, programs: renderer.info.programs ? renderer.info.programs.length : 0, calls: renderer.info.render.calls }),
  loopErrors: () => loopErrors,                     // 描画ループで握りつぶした例外の件数（0 が正常）
  breakRender: () => { renderer.render = () => { throw new Error("test"); }; },   // 例外が出てもゲームが止まらないことの検証用
  startGame, debugState: () => ({ pr: Quality.pr, fps: Quality.fps, phase: G.phase, exitNo: G.exitNo, round: G.round, anomaly: G.anomaly && G.anomaly.id, final: !!G.final, x: P.x, z: P.z, yaw: P.yaw }),
  forceAnomaly: (id) => { G.forced = id; },
  teleport: (z, x = 0) => { P.z = z; P.x = x; },
  setYaw: (y) => { P.yaw = y; },
  mouseLook: (x, y) => mouseLook(x, y),             // ポインターロック無しでマウスの移動量を流す（外れ値除去・ならしの検証用）
  skipIntro: () => { if (G.phase === "intro") { G.phase = "play"; nextScene(); } },
  renderOnly(id, yaw = 0, z = SPAWN_Z) {            // 判定に触れず、その異変だけ描いた画像を返す（視認性の差分検証用）
    const a = id ? ANOMALIES.find((x) => x.id === id) : null, s = makeScene(3, a);
    camera.position.set(0, EYE, z); camera.rotation.set(0, yaw, 0); renderer.render(s.scene, camera);
    const url = canvas.toDataURL("image/png"); disposeScene(s); return url;
  },
};
// 画面を空にしないための初回描画
{ const s = makeScene(0, null); camera.position.set(0, EYE, SPAWN_Z); renderer.render(s.scene, camera); disposeScene(s); }
</script>
